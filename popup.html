<!doctype html>
<html><head><meta charset="utf-8"><title>Disney Watch Party</title>
<style>
  body{width:280px;margin:0;padding:16px;background:#1a1d29;color:#f9f9f9;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  h1{font-size:17px;margin:0 0 10px}
  ol{margin:0 0 14px;padding-left:20px;color:#d6d9e3}
  li{margin-bottom:6px}
  button{width:100%;padding:10px;border:0;border-radius:8px;background:#0072d2;color:#f9f9f9;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#1a86e6}
  .v{margin-top:10px;text-align:center;font-size:11px;color:#8a8fa3}
</style></head>
<body>
  <h1>Disney Watch Party</h1>
  <ol>
    <li>Open Disney+ and pick something to watch.</li>
    <li>In the side panel, enter your name and start a party, or enter a friend's code to join.</li>
    <li>Share the 4-letter code. Everyone stays in sync and can chat.</li>
  </ol>
  <button id="open">Open Disney+</button>
  <div class="v" id="ver"></div>
  <script src="popup.js"></script>
</body></html>
